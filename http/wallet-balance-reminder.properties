# CRON triggers Expression
#Checks overall balance every 2 hours, from 6 AM to 10 PM, at minute 10.
overall.balance.check.trigger=0 10 6-22/2 ? * * *
#Checks daily balance every day at 7:15 AM.
daily.balance.check.trigger=0 15 7 ? * * *
#Checks client balance every hour, at 5 minutes past the hour.
client.balance.check.trigger=0 5 0/1 ? * * *
#Triggers wallet backup every hour, at the start of the hour.
wallet.backup.trigger=0 0 0/1 ? * * *

client.balance.check.enabled=1

client.balance.reminder.mail.count.per.day=3
client.balance.reminder.data.log.path=/home/apps/wallet/logs

#always integer value. Not Float value
minimum.balance.to.notify=100

#overall.balance.reminder.subject.format=Relay - Wallet Balance Alert on {0}
#daily.balance.reminder.subject.format=Relay - Daily Wallet Balance Alert on {0}

overall.balance.reminder.subject.format=Relay - Wallet Balance Alert on {0}
daily.balance.reminder.subject.format=Relay - Daily Wallet Balance Alert on {0}

# 0 - Client Id Ascending
# 1 - User Name Ascending
# 2 - Balance Ascending
# 3 - Balance Descending
overall.sort.by=2
daily.sort.by=2

overall.groupby.enabled=0
daily.groupby.enabled=0


